<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>档案-08</title>
<link rel="stylesheet" href="style.css">
<script>(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,"clarity","script","v60r6kypoj");</script>
</head>
<body>
<h2>第8页 · 地址指引</h2>
<div class="box">
<p>这一页，没有输入框。</p>
<p>因为答案不是文字，而是这个页面本身。</p>
</div>
<button onclick="showHint()">提示</button>
<div class="tip" id="hintBox"></div>
<div class="msg" id="msg"></div>
<div class="back">
<button onclick="location.href='index.html'">返回首页</button>
</div>
<script>
const levelNum = 8;
let hintUsed = false;
let unlock = localStorage.getItem('unlockLevel');
if(Number(unlock) < levelNum){
    alert("这份档案尚未解锁，无法访问！");
    location.href = "index.html";
}
function showHint(){
    if(!hintUsed){
        document.getElementById("hintBox").innerText = "看一下地址栏，有没有发现什么？";
        document.getElementById("hintBox").style.display="block";
        hintUsed=true;
    }else{
        alert("提示已用尽");
    }
}
</script>
</body>
</html>
