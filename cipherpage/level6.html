<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>档案-06</title>
<link rel="stylesheet" href="style.css">
<script>(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,"clarity","script","v60r6kypoj");</script>
</head>
<body>
<h2>第6页 · 文本转译</h2>
<div class="box">
<p>原始文本被做了一次标准化编码。</p>
<p>将编码还原，得到这一页的答案。</p>
<br>
<p style="font-size:1.4rem">Y29kZQ==</p>
</div>
<input id="ans" placeholder="输入答案">
<button onclick="check()">提交</button>
<button onclick="showHint()">提示</button>
<div class="tip" id="hintBox"></div>
<div class="msg" id="msg"></div>
<div class="back">
<button onclick="location.href='index.html'">返回首页</button>
</div>
<script>
const levelNum = 6;
const nextLevel = "level7.html";
// 答案：code 反转存储 edoc
const answerRev = "edoc";
const hintText = "Base64";
let hintUsed = false;
let unlock = localStorage.getItem('unlockLevel');
if(Number(unlock) < levelNum){
    alert("这份档案尚未解锁，无法访问！");
    location.href = "index.html";
}
function check(){
    let input = document.getElementById("ans").value.trim().toLowerCase();
    let realAns = answerRev.split('').reverse().join('');
    if(input === realAns){
        document.getElementById("msg").innerText = "档案破译成功，解锁下一页...";
        localStorage.setItem('unlockLevel', levelNum+1);
        setTimeout(()=>location.href=nextLevel,1500);
    }else{
        document.getElementById("msg").innerText = "破译失败，再仔细寻找线索。";
    }
}
function showHint(){
    if(!hintUsed){
        document.getElementById("hintBox").innerText = hintText;
        document.getElementById("hintBox").style.display="block";
        hintUsed=true;
    }else{
        alert("提示已用尽");
    }
}
</script>
</body>
</html>
