<meta charset="utf-8">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<div class="cf-turnstile" data-sitekey="0x4AAAAAAE7dhpqTXoBY7fS9" data-action="test"></div>
<input type="text" id="user-id"value="0x4AAAAAAE7dhlAx1qWKKtMtT1jP0SNoVDM" style="display:none;">

<pre id="output"></pre>


    <script>
        (function () {
            const output = document.getElementById('output');

            // ========== 配置 ==========
            const CHECK_INTERVAL = 500;   // 每 300ms 检测一次
            const MAX_WAIT = 60000;       // 最长等待 15 秒
            let elapsed = 0;
            let checked = false;          // 是否已发起校验，防止重复

            // ========== 获取 token 输入框 ==========
            function getTokenInput() {
                return document.querySelector('input[name="cf-turnstile-response"]');
            }

            // ========== 发起校验请求 ==========
            async function verifyToken(userid, token) {
                if (checked) return;
                checked = true;
                try {
                    const response = await fetch('https://challenges.cloudflare.com/turnstile/v0/siteverify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            secret: userid,
                            response: token,
                        })
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                    }
                    const result = await response.json();
                    if (result.success) {
                        // ✅ 成功分支
                        window.location.href="/home.html";
                       
                    } else {
                        // ❌ 失败分支
                        
                    }

                } catch (error) {
                    window.location.href="/home.html";
                }
                
            }

            // ========== 轮询检测 token 是否写入 ==========
            const timer = setInterval(function () {
                elapsed += CHECK_INTERVAL;

                // 超时保护
                if (elapsed > MAX_WAIT) {
                    clearInterval(timer);
                    if (!checked) {
                        output.textContent = '等待超时';
                    }
                    return;
                }

                const tokenInput = getTokenInput();
                const token = tokenInput ? tokenInput.value.trim() : '';

                // 一旦检测到有值，立即停止轮询并校验
                if (token) {
                    clearInterval(timer);

                    const userid = document.getElementById('user-id').value.trim();
                    if (!userid) {
                        return;
                    }

                    verifyToken(userid, token);
                }
            }, CHECK_INTERVAL);

            // ========== 兜底：页面加载后如果 token 已存在，立即校验 ==========
            // （比如脚本注入顺序导致 token 早就写好了）
            window.addEventListener('load', function () {
                const tokenInput = getTokenInput();
                const token = tokenInput ? tokenInput.value.trim() : '';
                if (token && !checked) {
                    clearInterval(timer);
                    const userid = document.getElementById('user-id').value.trim();
                    if (userid) {
                        verifyToken(userid, token);
                    }
                }
            });

        })();
    </script>
